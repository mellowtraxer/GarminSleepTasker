name: Build Android APK

on:
  push:
    branches: [ "main", "v1.1-garmin-connect" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        if: github.ref == 'refs/heads/v1.1-garmin-connect'
        env:
          GARMIN_SIGNING_KEYSTORE_BASE64: ${{ secrets.GARMIN_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$GARMIN_SIGNING_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$GARMIN_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GarminSleepTasker-v1.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
