name: Build Android APK

on:
  push:
    branches: [ "main", "v1.1-garmin-connect", "v2-store-ui" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        if: github.ref == 'refs/heads/v1.1-garmin-connect' || github.ref == 'refs/heads/v2-store-ui'
        env:
          GARMIN_SIGNING_KEYSTORE_BASE64: ${{ secrets.GARMIN_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$GARMIN_SIGNING_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$GARMIN_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "Keystore file SHA-256:"
          sha256sum "$HOME/.android/debug.keystore"
          echo "Keystore certificate:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|SHA-256:"

      - name: Download cosmic card artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 --max-time 35 \
            'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=1100&q=88&fit=crop' \
            -o app/src/main/res/drawable-nodpi/cosmic_planet.jpg
          curl --fail --location --retry 3 --max-time 35 \
            'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1100&q=88&fit=crop' \
            -o app/src/main/res/drawable-nodpi/cosmic_crescent.jpg
          file app/src/main/res/drawable-nodpi/cosmic_*.jpg

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/v2-store-ui' && 'SleepSync-v2-preview' || 'GarminSleepTasker-v1.1-debug' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Private-repo bridge: CI publishes only the signed preview APK + tiny version manifest
      # to the public updater branch. No GitHub credential is ever embedded in SleepSync.
      - name: Publish SleepSync preview update channel
        if: github.ref == 'refs/heads/v2-store-ui' && github.event_name == 'push'
        env:
          UPDATE_CHANNEL_TOKEN: ${{ secrets.SLEEPSYNC_UPDATE_CHANNEL_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$UPDATE_CHANNEL_TOKEN"
          rm -rf /tmp/sleepsync-updates
          git clone "https://x-access-token:${UPDATE_CHANNEL_TOKEN}@github.com/mellowtraxer/SleepSync-Updates.git" /tmp/sleepsync-updates
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/sleepsync-updates/SleepSync-preview.apk
          cat > /tmp/sleepsync-updates/latest.json <<EOF
          {
            "versionCode": ${RUN_NUMBER},
            "versionName": "0.1.0-v2-dev.${RUN_NUMBER}",
            "commit": "${COMMIT_SHA}",
            "apk": "https://github.com/mellowtraxer/SleepSync-Updates/raw/main/SleepSync-preview.apk"
          }
          EOF
          cd /tmp/sleepsync-updates
          git config user.name "SleepSync Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SleepSync-preview.apk latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish SleepSync preview build ${RUN_NUMBER}"
          # Serialize publication and never let an older run replace a newer APK.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            CURRENT=$(python3 -c 'import json; print(json.load(open("latest.json")).get("versionCode",0))' 2>/dev/null || echo 0)
            if [ "$CURRENT" -ge "$RUN_NUMBER" ]; then
              echo "Build $CURRENT already published; skipping older $RUN_NUMBER"
              exit 0
            fi
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" SleepSync-preview.apk
            cat > latest.json <<EOF
          {
            "versionCode": ${RUN_NUMBER},
            "versionName": "0.1.0-v2-dev.${RUN_NUMBER}",
            "commit": "${COMMIT_SHA}",
            "apk": "https://github.com/mellowtraxer/SleepSync-Updates/raw/main/SleepSync-preview.apk"
          }
          EOF
            git add SleepSync-preview.apk latest.json
            git commit -m "Publish SleepSync preview build ${RUN_NUMBER}"
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
